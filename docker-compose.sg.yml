# docker-compose.sg.yml —— SG 生产机覆写层（与 docker-compose.yml 叠加用：
# docker compose -f docker-compose.yml -f docker-compose.sg.yml up -d），自 nox 誊入。
# 覆写点：①生产 PG 端口 15433（宿主 5433 已被 alphaforge-postgres 占用）；
# ②SG 机型资源降配（core 1500m/2c、pg 2500m/2c/512m shm；test 库维持基线）；
# ③pg 切 timescaledb——SG 本地薄镜像 o-postgres:18-tsdb-2.30.2
#   （postgres:18 底 + timescaledb-2-postgresql-18 2.30.2 包自构建；
#   SG 拉不动官方 timescale/timescaledb:2.30.2-pg18 故等价自建，扩展版本同源 2.30.2）。
#   GUC 手调按 2500m 帽（不信镜像默认 tune）。
#   回滚=删 image/command 两行覆写 + compose up -d 重建（extension 已建未
#   hypertable 化=可降级）。
services:
  o-core:
    mem_limit: 1500m
    cpus: 2

  o-postgres:
    image: o-postgres:18-tsdb-2.30.2
    command: >-
      -c shared_preload_libraries=timescaledb,pg_stat_statements
      -c shared_buffers=640MB
      -c effective_cache_size=1792MB
      -c work_mem=8MB
      -c maintenance_work_mem=256MB
    mem_limit: 2500m
    cpus: 2
    shm_size: "512m"
    ports: !override
      - "127.0.0.1:15433:5432"

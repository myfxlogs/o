<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TRX 自营盘</title>
  <style>
    :root{--bg:#0b0e14;--card:rgba(255,255,255,.04);--txt:#e8ecf3;--dim:#8b9bb4;
      --up:#34d399;--dn:#f87171;--warn:#fbbf24;--line:rgba(255,255,255,.08)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--txt);font:14px/1.5 -apple-system,"PingFang SC",sans-serif;padding:24px}
    .hero{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
    .hero h1{font-size:20px;letter-spacing:2px}
    .badge{font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 8px}
    .stamp{color:var(--dim);font-size:12px;margin-left:auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;margin-bottom:18px}
    .card h2{font-size:13px;color:var(--dim);font-weight:500;letter-spacing:1px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
    .kpi b{font-size:20px;font-weight:600}
    .kpi span{display:block;color:var(--dim);font-size:11px;margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{color:var(--dim);font-weight:400;text-align:left;font-size:11px;padding:4px 8px;border-bottom:1px solid var(--line)}
    td{padding:8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
    .up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}
    .muted{color:var(--dim)}
    .empty{color:var(--dim);padding:14px 0;font-size:13px}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
    .ok{background:var(--up)}.off{background:var(--warn)}.bad{background:var(--dn)}
    button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:12px}
    button:hover{border-color:var(--dim)}
    .bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:4px}
    .bar i{display:block;height:100%;background:var(--up)}
  </style>
</head>
<body>
  <div class="hero">
    <h1>TRX 自营盘</h1>
    <span class="badge">业绩外 · 自营盘（D-629）——不计入 NAV/业绩面</span>
    <span class="stamp" id="stamp"></span>
  </div>
  <section class="card"><h2>收 益 雷 达 <i class="muted" style="font-style:normal">赚多少</i></h2><div id="radar"></div></section>
  <section class="card">
    <h2>对 冲 结 构 <i class="muted" style="font-style:normal">安全吗</i>
      <span id="wsdot"></span><button id="refresh">↻ 刷新</button></h2>
    <div id="hedge"></div>
  </section>
  <section class="card"><h2>对 冲 流 水 <i class="muted" style="font-style:normal">发生了什么</i></h2><div id="flow"></div></section>
  <section class="card"><h2>监 控 提 醒</h2><div id="watch"></div></section>
  <script type="module" src="/src/trx.ts"></script>
</body>
</html>

# mt4/mt5 代码生成——严格隔离，不与 dashboard 混生成。
# mt4 和 mt5 是完全不同的平台，proto 独立、生成路径独立、包名独立。
# 生成命令：buf generate --template buf.gen.mtapi.yaml
version: v2
plugins:
  - local: protoc-gen-go
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: internal/gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/gen
    opt: paths=source_relative
inputs:
  - directory: proto
    paths:
      # mt4 面未入仓（T-0031 只接 mt5 读面——mt4 需要时按权威源 /opt/grpc-proto/mt4 再入）
      - proto/mtapi/mt5

# o-bridge 采集桥服务定义（T-0137/D-0020——产研隔离：镜像 tag 钉构建 hash
# 非 latest；运行目录 /opt/o-bridge/）。
services:
  o-bridge:
    image: o-bridge:BUILD_HASH # 构建时替换——禁 latest（实验分支不得漂移生产采集件）
    restart: unless-stopped
    environment:
      SG_PG_DSN: postgres://collector_rw:${COLLECTOR_RW_PASS}@127.0.0.1:5433/o
      # 隧道终点=dev 本地 5433→SG 127.0.0.1:5432（autossh -L；SG PG 端口
      # 只绑 127.0.0.1 公网零暴露——deploy/o-bridge/tunnel.service 单元钉存）
    network_mode: host

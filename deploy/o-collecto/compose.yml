# o-collecto 采集桥服务定义（T-0137/D-0020——产研隔离：镜像 tag 钉构建 hash
# 非 latest；运行目录 /opt/o-collecto/）。
services:
  o-collecto:
    image: o-collecto:BUILD_HASH # 构建时替换——禁 latest（实验分支不得漂移生产采集件）
    restart: unless-stopped
    environment:
      MD_PG_DSN: postgres://o:${O_PASS}@127.0.0.1:5435/o
      # T-0234 世系漂移修齐+T-0232 正名：键归 MD_PG_DSN=本机 PG-md 5435（md 正本面——
      # T-0211 迁 OCI 后采集落本地库；SG fin 径归 projector/ROSTER 键）。
    network_mode: host
